name: Propose upstream sync

on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  propose:
    if: github.repository == 'AQSAMA/JuneNotes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Merge upstream into a new review branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/DenserMeerkat/June.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo 'Already contains upstream/main.'
            exit 0
          fi
          upstream_sha=$(git rev-parse upstream/main)
          branch="sync/upstream-${upstream_sha:0:12}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "Sync branch already exists: $branch"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          if ! git merge --no-edit upstream/main; then
            echo '::error::Upstream conflicts require a local merge on a sync branch. See FORK.md; main has not changed.'
            exit 1
          fi
          git push origin "HEAD:refs/heads/$branch"
          printf 'Merge DenserMeerkat/June at %s into JuneNotes, retaining fork configuration and history.\n\nReview the merge and the explicitly dispatched Preview APK test run before merging. This PR is created with GITHUB_TOKEN, so pull_request CI is not triggered automatically. Permanent signing is disabled on sync branches.\n' "$upstream_sha" > "$RUNNER_TEMP/sync-pr.md"
          gh pr create --base main --head "$branch" --title "Sync upstream June (${upstream_sha:0:12})" --body-file "$RUNNER_TEMP/sync-pr.md"
          gh workflow run preview.yml --ref "$branch" -f test_only=true
