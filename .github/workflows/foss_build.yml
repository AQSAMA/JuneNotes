name: FOSS Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  ORG_GRADLE_PROJECT_juneApplicationId: ${{ vars.JUNE_APPLICATION_ID || 'com.denser.june' }}
  ORG_GRADLE_PROJECT_juneAppName: ${{ vars.JUNE_APP_NAME || 'June' }}
  ORG_GRADLE_PROJECT_juneUpdateRepository: ${{ vars.JUNE_UPDATE_REPOSITORY || 'DenserMeerkat/June' }}
  JUNE_VERSION_CODE_BASE: ${{ vars.JUNE_VERSION_CODE_BASE }}

# Serialise releases so older builds cannot replace a newer latest release.
concurrency:
  group: foss-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ vars.JUNE_APPLICATION_ID != '' && 'signing' || 'release' }}
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Configure fork version code
      run: bash .github/scripts/fork-version.sh

    - name: Decode Keystore
      env:
        ENCODED_STRING: ${{ secrets.RELEASE_KEYSTORE }}
      run: |
        test -n "$ENCODED_STRING"
        umask 077
        printf '%s' "$ENCODED_STRING" | base64 --decode > "$RUNNER_TEMP/release.p12"

    - name: Build with Gradle
      env:
        RELEASE_STORE_FILE: ${{ runner.temp }}/release.p12
        RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      run: bash gradlew :core:testReleaseUnitTest :app:testFossReleaseUnitTest :app:assembleFossRelease :app:signingReport

    - name: Verify Production APK
      env:
        EXPECTED_CERT: ${{ vars.JUNE_RELEASE_CERT_SHA256 }}
      run: python3 .github/scripts/verify-apk.py app/build/outputs/apk/foss/release/app-foss-release.apk "$ORG_GRADLE_PROJECT_juneApplicationId" "$JUNE_BUILD_VERSION_CODE" "$EXPECTED_CERT"

    - name: Remove signing material
      if: always()
      run: rm -f "$RUNNER_TEMP/release.p12"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: app/build/outputs/apk/foss/release/*.apk

    - name: Generate Artifact Attestation
      uses: actions/attest-build-provenance@v1
      with:
        subject-path: 'app/build/outputs/apk/foss/release/*.apk'

    - name: Extract Changelog Notes
      run: |
        python3 -c '
        import json, os
        tag = os.environ.get("GITHUB_REF_NAME", "")
        data = json.load(open("app/src/main/assets/changelog.json", encoding="utf-8"))
        entry = next((e for e in data if e.get("version") == tag), None)
        notes = []
        for c in (entry.get("changes", []) if entry else []):
            if isinstance(c, str):
                notes.append("- " + c)
            elif not c.get("flavors") or "foss" in c["flavors"]:
                notes.append("- " + c.get("text", ""))
        open("release_notes.md", "w", encoding="utf-8").write("\n".join(notes) + "\n" if notes else "")
        '

        if [ ! -s release_notes.md ]; then
          echo "::warning::Could not find changelog for $GITHUB_REF_NAME in changelog.json"
        fi

    - name: Record fork APK version code
      if: vars.JUNE_APPLICATION_ID != ''
      run: |
        printf '\n<!-- junenotes-version-code: %s -->\n' "$JUNE_BUILD_VERSION_CODE" >> release_notes.md

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        draft: false
        make_latest: true
        body_path: release_notes.md
        generate_release_notes: true
        files: app/build/outputs/apk/foss/release/app-foss-release.apk