name: Preview APK

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Test and build Preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          cmdline-tools-version: 13114758
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Keep preview signing stable for updates within this PR
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: june-preview-signing-${{ runner.os }}-${{ github.event.pull_request.number || github.ref_name }}
      - name: Test and build the preview variant
        run: bash gradlew :core:testDebugUnitTest :app:testFossDebugUnitTest :app:assembleFossPreview -PpreviewVersionCode=$((1000000 + GITHUB_RUN_NUMBER)) --stacktrace
      - name: Name the installable APK
        run: cp app/build/outputs/apk/foss/preview/app-foss-preview.apk June-Preview.apk
      - name: Upload Preview APK
        uses: actions/upload-artifact@v4
        with:
          name: Preview APK
          path: June-Preview.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Preview test reports
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
          if-no-files-found: ignore
      - name: Testing instructions
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## June Preview
          Download **Preview APK**, extract **June-Preview.apk**, and install it.
          App name: **June Preview**. App ID: **com.denser.june.preview**.
          It installs alongside June; its notes and settings are separate.
          Import your original June backup through Settings → Sync & backup.
          Folder data is additive; June can import the notes/media from preview exports.
          SUMMARY
