name: Preview APK

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_only:
        description: 'Use temporary signing for an upstream sync or other untrusted branch'
        type: boolean
        default: false

permissions:
  contents: read

env:
  ORG_GRADLE_PROJECT_juneApplicationId: ${{ vars.JUNE_APPLICATION_ID || 'com.denser.june' }}
  ORG_GRADLE_PROJECT_juneAppName: ${{ vars.JUNE_APP_NAME || 'June' }}
  ORG_GRADLE_PROJECT_juneUpdateRepository: ${{ vars.JUNE_UPDATE_REPOSITORY || 'DenserMeerkat/June' }}
  JUNE_VERSION_CODE_BASE: ${{ vars.JUNE_VERSION_CODE_BASE }}

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    outputs:
      version_code: ${{ steps.version.outputs.version_code }}
    runs-on: ubuntu-latest
    # PR merge refs cannot enter the branch-restricted signing environment.
    environment: ${{ github.event_name != 'pull_request' && !inputs.test_only && vars.JUNE_APPLICATION_ID != '' && 'signing' || 'ci' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Verify upstream default variants
        run: |
          env -u ORG_GRADLE_PROJECT_juneApplicationId -u ORG_GRADLE_PROJECT_juneAppName -u ORG_GRADLE_PROJECT_juneUpdateRepository bash gradlew :app:generateFossReleaseBuildConfig :app:generateFossPreviewBuildConfig :app:generateFossDebugBuildConfig :app:generatePlayReleaseBuildConfig :app:generatePlayPreviewBuildConfig :app:generatePlayDebugBuildConfig
          python3 - <<'PYTHON'
          from pathlib import Path
          for flavor in ('foss', 'play'):
              for build in ('release', 'preview', 'debug'):
                  config = Path(f'app/build/generated/source/buildConfig/{flavor}/{build}/com/denser/june/BuildConfig.java').read_text()
                  app_id = 'com.denser.june' + ('.play' if flavor == 'play' else '') + ('.' + build if build != 'release' else '')
                  assert f'APPLICATION_ID = "{app_id}"' in config, config
                  assert 'package com.denser.june;' in config
                  assert 'https://api.github.com/repos/DenserMeerkat/June/releases/latest' in config
                  print('Verified upstream default:', app_id)
          PYTHON
      - name: Configure fork version code
        id: version
        run: bash .github/scripts/fork-version.sh
      - name: Restore permanent Preview signing key
        if: github.event_name != 'pull_request' && !inputs.test_only && vars.JUNE_APPLICATION_ID != ''
        env:
          PREVIEW_KEYSTORE_BASE64: ${{ secrets.JUNE_PREVIEW_KEYSTORE_BASE64 }}
          PREVIEW_STORE_PASSWORD: ${{ secrets.JUNE_PREVIEW_STORE_PASSWORD }}
          PREVIEW_KEY_ALIAS: ${{ secrets.JUNE_PREVIEW_KEY_ALIAS }}
          PREVIEW_KEY_PASSWORD: ${{ secrets.JUNE_PREVIEW_KEY_PASSWORD }}
        run: |
          test -n "$PREVIEW_KEYSTORE_BASE64"
          test -n "$PREVIEW_STORE_PASSWORD"
          test -n "$PREVIEW_KEY_ALIAS"
          test -n "$PREVIEW_KEY_PASSWORD"
          umask 077
          printf '%s' "$PREVIEW_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/preview.p12"
          echo "ORG_GRADLE_PROJECT_previewStoreFile=$RUNNER_TEMP/preview.p12" >> "$GITHUB_ENV"
      - name: Validate and build Preview APK
        env:
          PREVIEW_STORE_PASSWORD: ${{ secrets.JUNE_PREVIEW_STORE_PASSWORD }}
          PREVIEW_KEY_ALIAS: ${{ secrets.JUNE_PREVIEW_KEY_ALIAS }}
          PREVIEW_KEY_PASSWORD: ${{ secrets.JUNE_PREVIEW_KEY_PASSWORD }}
        run: bash gradlew :core:testReleaseUnitTest :app:testFossPreviewUnitTest :app:assembleFossPreview :app:assembleFossDebug :app:assemblePlayDebug :app:signingReport --stacktrace
      - name: Verify APK identities
        env:
          EXPECTED_PREVIEW_CERT: ${{ github.event_name != 'pull_request' && !inputs.test_only && vars.JUNE_APPLICATION_ID != '' && vars.JUNE_PREVIEW_CERT_SHA256 || '' }}
        run: |
          cp app/build/outputs/apk/foss/preview/*.apk June-Preview.apk
          python3 .github/scripts/verify-apk.py June-Preview.apk "$ORG_GRADLE_PROJECT_juneApplicationId.preview" "$JUNE_BUILD_VERSION_CODE" "$EXPECTED_PREVIEW_CERT"
          python3 .github/scripts/verify-apk.py app/build/outputs/apk/foss/debug/app-foss-debug.apk "$ORG_GRADLE_PROJECT_juneApplicationId.debug" "$JUNE_BUILD_VERSION_CODE"
          python3 .github/scripts/verify-apk.py app/build/outputs/apk/play/debug/app-play-debug.apk "$ORG_GRADLE_PROJECT_juneApplicationId.play.debug" "$JUNE_BUILD_VERSION_CODE"
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/preview.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ (github.event_name == 'pull_request' || inputs.test_only) && 'Preview APK (PR test, temporary signature)' || 'Preview APK' }}
          path: June-Preview.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Test reports
          path: |
            core/build/reports/tests/
            app/build/reports/tests/

  folder-database-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash gradlew :core:connectedDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Database test reports and Room schema
          path: |
            core/build/reports/androidTests/
            core/schemas/

  folder-ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/scripts/check-folder-ui.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Debug APK (arm64)
          path: app/build/outputs/apk/foss/debug/*arm64-v8a*.apk
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Folder UI tests and screenshots
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/ui-checks/

  publish-preview:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !inputs.test_only && vars.JUNE_APPLICATION_ID != ''
    needs: [preview, folder-database-tests, folder-ui-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Preview APK
      - name: Publish signed Preview prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APK_VERSION_CODE: ${{ needs.preview.outputs.version_code }}
        run: |
          set -euo pipefail
          code="$APK_VERSION_CODE"
          [[ "$code" =~ ^[0-9]+$ ]]
          python3 .github/scripts/check-release-version.py preview "$code"
          printf 'Trusted Preview from %s.\n\n<!-- junenotes-version-code: %s -->\n' "$GITHUB_SHA" "$code" > notes.md
          if gh release view preview >/dev/null 2>&1; then
            gh release edit preview --notes-file notes.md --prerelease --latest=false
          else
            gh release create preview --target "$GITHUB_SHA" --title 'JuneNotes Preview' --prerelease --latest=false --notes-file notes.md
          fi
          gh release upload preview June-Preview.apk --clobber
