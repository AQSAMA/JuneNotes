name: Preview APK

on:
  pull_request:
  push:
    branches: [main, 'feat/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Restore stable preview signing key
        id: preview-key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: june-preview-signing-v1
      - name: Create preview signing key if needed
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -dname 'CN=June Preview,O=June,C=US' -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Validate and build Preview APK
        run: bash gradlew :core:testReleaseUnitTest :app:testFossPreviewUnitTest :app:assembleFossPreview -PpreviewVersionCode=$((102010 + GITHUB_RUN_NUMBER)) --stacktrace
      - name: Name Preview APK
        run: cp app/build/outputs/apk/foss/preview/*.apk June-Preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Preview APK
          path: June-Preview.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Test reports
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
